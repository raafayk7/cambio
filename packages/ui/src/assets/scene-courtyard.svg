<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    scene-courtyard (patterns/scenes.md, lobby row; realized CAM-17 via
    the creation gate). Flat ink + token palette only, no gradients.
    An external background SVG cannot read page CSS variables, so the
    primitives are inlined by value (theme-fixed scene chrome, the
    scene-paving precedent). Map:
      #f6dcae cream-scene   #eee9d2 cream-card   #d3a266 tan-paving
      #b3613a terracotta    #8e4224 brick-deep   #be5d2e brick-bright
      #36634a green-table   #27311e green-deep   #5d5d31 olive
      #f8ba66 mustard       #0d0d08 ink
    Composition rule: edges carry the scene, the center stays calm so
    panels and forms sit readably on it. Scene art never carries
    information.
  -->
  <defs>
    <pattern id="bricks" width="180" height="68" patternUnits="userSpaceOnUse">
      <rect width="180" height="68" fill="#eee9d2" />
      <rect x="0" y="2" width="86" height="30" fill="#d3a266" />
      <rect x="90" y="2" width="86" height="30" fill="#b3613a" />
      <rect x="-45" y="36" width="86" height="30" fill="#b3613a" />
      <rect x="45" y="36" width="86" height="30" fill="#d3a266" />
      <rect x="135" y="36" width="86" height="30" fill="#d3a266" />
    </pattern>
  </defs>

  <!-- courtyard floor -->
  <rect width="1600" height="1000" fill="#f6dcae" />

  <!-- sparse worn flagstones keeping the middle a courtyard, calmly -->
  <g fill="#eee9d2">
    <rect x="470" y="330" width="130" height="56" rx="18" />
    <rect x="980" y="270" width="110" height="50" rx="16" />
    <rect x="700" y="560" width="150" height="60" rx="20" />
    <rect x="380" y="700" width="110" height="50" rx="16" />
    <rect x="1120" y="640" width="130" height="56" rx="18" />
    <rect x="820" y="120" width="100" height="46" rx="15" />
  </g>

  <!-- bottom brick paving band -->
  <rect x="0" y="900" width="1600" height="100" fill="url(#bricks)" />
  <rect x="0" y="894" width="1600" height="8" fill="#8e4224" />

  <!-- ===== top-left umbrella (cropped by the edge; pole grounds behind
       the left bench so the drawing keeps its physical logic) ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <line x1="210" y1="170" x2="210" y2="562" />
    <!-- canopy: three gores, mustard / brick-bright / mustard -->
    <path d="M 210 12 Q 80 24 -60 176 Q 20 158 92 154 Q 130 56 210 12 Z" fill="#f8ba66" />
    <path d="M 210 12 Q 130 56 92 154 Q 210 140 328 154 Q 290 56 210 12 Z" fill="#be5d2e" />
    <path d="M 210 12 Q 290 56 328 154 Q 400 158 480 176 Q 340 24 210 12 Z" fill="#f8ba66" />
    <circle cx="210" cy="12" r="10" fill="#f8ba66" />
  </g>

  <!-- ===== top-right umbrella, smaller (pole grounds behind the
       bottom-right bench) ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <line x1="1430" y1="120" x2="1430" y2="772" />
    <path d="M 1230 130 Q 1330 8 1430 2 L 1430 118 Q 1320 120 1230 152 Z" fill="#be5d2e" />
    <path d="M 1430 2 Q 1540 8 1650 130 L 1650 152 Q 1540 120 1430 118 Z" fill="#f8ba66" />
    <circle cx="1430" cy="4" r="9" fill="#be5d2e" />
  </g>

  <!-- ===== bench, left edge ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round">
    <rect x="-80" y="560" width="300" height="34" rx="10" fill="#b3613a" />
    <rect x="-80" y="604" width="300" height="16" rx="8" fill="#8e4224" />
    <rect x="-20" y="620" width="22" height="80" fill="#8e4224" />
    <rect x="170" y="620" width="22" height="80" fill="#8e4224" />
  </g>

  <!-- ===== bench, bottom-right (cropped) ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round">
    <rect x="1380" y="770" width="300" height="34" rx="10" fill="#b3613a" />
    <rect x="1380" y="814" width="300" height="16" rx="8" fill="#8e4224" />
    <rect x="1420" y="830" width="22" height="70" fill="#8e4224" />
    <rect x="1600" y="830" width="22" height="70" fill="#8e4224" />
  </g>

  <!-- ===== foliage cluster, bottom-left, in a planter ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round">
    <circle cx="120" cy="810" r="86" fill="#27311e" />
    <circle cx="220" cy="780" r="70" fill="#36634a" />
    <circle cx="60" cy="760" r="62" fill="#36634a" />
    <circle cx="160" cy="740" r="48" fill="#5d5d31" />
    <path d="M 20 872 L 300 872 L 274 960 L 46 960 Z" fill="#b3613a" />
  </g>

  <!-- ===== small potted plant by the right bench ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round">
    <circle cx="1320" cy="812" r="44" fill="#36634a" />
    <circle cx="1288" cy="836" r="30" fill="#5d5d31" />
    <path d="M 1276 852 L 1364 852 L 1350 918 L 1290 918 Z" fill="#b3613a" />
  </g>

  <!-- ===== foliage sprig, right edge mid ===== -->
  <g stroke="#0d0d08" stroke-width="5" stroke-linejoin="round">
    <circle cx="1590" cy="470" r="70" fill="#36634a" />
    <circle cx="1560" cy="410" r="44" fill="#27311e" />
  </g>
</svg>
